name: Build LegionAura

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn -B clean package

      - name: Upload LegionAura JAR
        uses: actions/upload-artifact@v4
        with:
          name: LegionAura
          path: target/LegionAura-*.jar
          if-no-files-found: error
